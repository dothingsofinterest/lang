<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Extract MP4 Audio</title>
        <style>
            * {
                outline: none;
            }
            html,
            body,
            p,
            h1,
            h2,
            h3,
            h4,
            h5,
            ul,
            ol,
            li {
                margin: 0;
                padding: 0;
            }
            body {
                margin: 0;
                padding: 0;
                font-size: 14px;
                font-family: "Hiragino Sans GB", "Microsoft Yahei", "SimSun", Arial, "Helvetica Neue", Helvetica;
                color: #333;
                word-wrap: break-word;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            ol,
            ul,
            li {
                list-style: none;
            }
            article {
                width: 1000px;
            }
            article h1 {
                text-align: center;
                font-size: 16px;
                font-weight: 900;
                line-height: 50px;
                color: #000;
                margin: 10px 0;
            }
            article h2 {
                text-align: center;
                font-size: 14px;
                font-weight: 300;
                line-height: 20px;
                color: #000;
                margin: 10px 16px;
            }
            article .scene {
                background: #ccc;
                padding: 6px 0;
                margin-bottom: 10px;
            }
            article .p {
                border: 1px dotted #000;
                margin: 12px 20px;
                padding: 2px 6px;
                color: #000;
                font-size: 14px;
                line-height: 28px;
            }
            article .p .point {
                padding: 0 4px;
            }
            article .p .role {
                font-style: normal;
                font-weight: 900;
                padding-right: 2px;
            }
            article .p ul {
                font-style: normal;
                font-size: 12px;
            }
            article footer {
                height: 100%;
            }
            article footer .vocabs {
                margin-bottom: 10px;
            }
            article footer .vocabs,
            article footer .notes {
                color: #fff;
                line-height: 28px;
                background-color: #333;
                padding: 10px 15px;
            }
            article footer .vocabs .item-index,
            article footer .notes .item-index {
                font-weight: 900;
            }
            article footer .vocabs .title,
            article footer .notes .title {
                line-height: 36px;
                display: flex;
                align-items: center;
                text-align: center;
                justify-content: center;
                font-weight: 900;
                font-size: 14px;
            }
            article footer .title:before,
            article footer .title:after {
                position: relative;
                width: 50%;
                border-block-start: 1px dotted #fff;
                border-block-end: 0;
                transform: translateY(50%);
                content: "";
            }
        </style>
    </head>
    <body>
        <div style="border: 1px solid red; background: purple">
            <div style="border: 1px solid green; width: 2200px">abc</div>
        </div>
    </body>
</html>
